---
# octocov configuration. See https://github.com/k1LoW/octocov
#
# Informational only: no `coverage.acceptable` threshold is set, so octocov
# never fails the build (keeps coverage non-gating). Test Execution Time is
# measured automatically on GitHub Actions, so no `testExecutionTime` block is
# needed. Unit tests live inline in `src/**` under `#[cfg(test)]`, so there is
# no separate test tree for a `codeToTestRatio` block to measure.
coverage:
  # LCOV report generated from cargo-llvm-cov profdata in wc-coverage.yml
  # (octocov uses SF/DA records only).
  paths:
  - coverage/lcov.info
comment:
  if: is_pull_request
  updatePrevious: true
report:
  # Publish the report to GitHub Actions Artifacts only from the default branch,
  # so the aggregating repo (takumin/octocov-central) sees main's coverage and
  # PR diffs compare against it.
  if: is_default_branch
  datastores:
  - artifact://${GITHUB_REPOSITORY}
diff:
  datastores:
  - artifact://${GITHUB_REPOSITORY}
