---
# https://taskfile.dev
# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

includes:
  setup:
    taskfile: setup.task.yml
    internal: true

tasks:
  default:
    desc: '{{.TASK}}'
    silent: true
    cmds:
    - task: test

  test:
    desc: '{{.TASK}}'
    label: test:workspace
    dir: '{{.ROOT_DIR}}'
    deps:
    - task: setup:test
    sources:
    - 'Cargo.toml'
    - 'Cargo.lock'
    - 'src/**/*.rs'
    - 'tests/**/*.rs'
    # Fingerprint the task's own definition and the pinned toolchain so editing
    # this task's commands or bumping rust-toolchain.toml re-runs it locally
    # instead of being skipped on a stale .task/.done_* marker.
    - 'tasks/test.task.yml'
    - 'rust-toolchain.toml'
    generates:
    - .task/.done_{{.TASK}}
    cmds:
    - cargo test --frozen --workspace
    - cmd: touch .task/.done_{{.TASK}}
      silent: true

  rest-api:
    desc: '{{.TASK}}'
    label: test:rest-api
    dir: '{{.ROOT_DIR}}'
    deps:
    - task: setup:test
    cmds:
    # Downloads the REST API description pinned in src/schema.rs
    - cargo test --frozen --workspace -- --ignored rest_api_description
