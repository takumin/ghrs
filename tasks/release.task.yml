---
# https://taskfile.dev
# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:
  default:
    desc: '{{.TASK}}'
    vars:
      VERSION:
        sh: cargo metadata --format-version=1 --no-deps | jq -r '.packages[0].version'
    cmds:
    - git tag -m "v{{.VERSION}}" "v{{.VERSION}}"
