[package]
name = "ghrs"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
readme = "README.md"
publish = false
homepage = "https://github.com/takumin/ghrs"
repository = "https://github.com/takumin/ghrs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
jsonwebtoken = { version = "10.4.0", default-features = false, features = [
  "use_pem",
] }
# The default `jwt-rust-crypto` backend pulls in the `rsa` crate (RUSTSEC-2023-0071, no fixed
# version), so App JWTs are signed with aws-lc-rs instead. The rest are octocrab's defaults.
octocrab = { version = "0.54.5", default-features = false, features = [
  "default-client",
  "follow-redirect",
  "jwt-aws-lc-rs",
  "retry",
  "rustls",
  "rustls-ring",
  "timeout",
  "tracing",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros"] }
toml = { version = "1.1.8", features = ["preserve_order"] }
